name: Run MyWhoosh2Garmin

on:
  schedule:
    # Runs every 30 minutes between 10am and 10pm (8:00-21:30 UTC covering CET/CEST)
    - cron: '*/30 8-21 * * *'
  workflow_dispatch:
    inputs:
      activity_id:
        description: "Optional Intervals.icu Activity ID (e.g. i204876551). Leave empty to check last 5."
        required: false
        default: ""

jobs:
  run-myWhoosh2Garmin:
    name: Run MyWhoosh2Garmin
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Install project (from pyproject.toml)
        shell: bash
        run: |
          uv sync --frozen

      - name: Run myWhoosh2Garmin.py
        shell: bash
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python myWhoosh2Garmin.py --activity-id "${{ inputs.activity_id }}"

      - name: Trim runner logs
        if: always()
        shell: bash
        run: |
          find "${RUNNER_WORKSPACE}/../_diag" -type f -name "*.log" -mtime +3 -delete 2>/dev/null || true


